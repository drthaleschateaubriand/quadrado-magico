<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quadrado Mágico</title>
<link rel="stylesheet" href="styles.css?v=202611011700">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<canvas id="board"></canvas>
<textarea id="textEditor" class="hidden" placeholder="Digite..."></textarea>
<div id="toolbar" class="panel">
  <button data-tool="select" title="Selecionar/mover (V)">🖱️</button>
  <button data-tool="pen" title="Caneta (P)">✏️</button>
  <button data-tool="rect" title="Retângulo (R)">▭</button>
  <button data-tool="ellipse" title="Elipse (O)">◯</button>
  <button data-tool="line" title="Linha (L)">╱</button>
  <button data-tool="arrow" title="Seta (A)">➝</button>
  <button data-tool="text" title="Texto (T)">T</button>
  <button data-tool="eraser" title="Borracha (E)">🧽</button>
  <button data-tool="hand" title="Mover tela (H)">✋</button>
  <label id="fileBtn" class="filebtn" title="Enviar arquivo (PDF, Word, imagens…) — também pode arrastar ou colar">📎<input type="file" id="fileInput" multiple style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden"></label>
  <span class="tb-sep"></span>
  <button id="openBtn" class="hidden" title="Abrir arquivo aqui no app">📂</button>
  <button id="undoBtn" title="Desfazer (Ctrl+Z)">↶</button>
  <button id="redoBtn" title="Refazer (Ctrl+Shift+Z)">↷</button>
  <button id="deleteBtn" title="Excluir seleção (Del) — sem seleção: limpar o quadro">🗑️</button>
  <button id="trashBtn" title="Lixeira">🗃️<span id="trashBadge" class="hidden">0</span></button>
  <button id="optsBtn" title="Opções" aria-expanded="false">▾</button>
  <div id="stylebar" class="hidden">
    <label>Traço <input type="color" id="strokeColor" value="#1e1e1e"></label>
    <label><input type="checkbox" id="fillOn"> Preench. <input type="color" id="fillColor" value="#a5d8ff"></label>
    <label>Espessura <input type="range" id="strokeWidth" min="1" max="20" value="3"></label>
  </div>
</div>

<div id="tabbar"><div id="tabList"></div><button id="addTab" title="Nova aba">+</button></div>
<div id="tabMenu" class="hidden"><button data-act="rename">✏️ Renomear</button><button data-act="save">💾 Salvar</button><button data-act="delete" class="danger">🗑️ Excluir</button></div>
<div id="trashView" class="hidden"><div class="tv-box">
  <div class="tv-head"><span class="tv-title">🗃️ Lixeira</span><button id="trashClose" title="Fechar">✕</button></div>
  <div id="trashList"></div>
  <div class="tv-foot"><button id="emptyTrash" class="danger">Esvaziar lixeira</button></div>
</div></div>
<div id="qmDialog" class="hidden" role="dialog" aria-modal="true"><div class="dlg-box">
  <div class="dlg-title"></div><div class="dlg-msg"></div><input class="dlg-input hidden" type="text" maxlength="80">
  <div class="dlg-btns"><button class="dlg-cancel">Cancelar</button><button class="dlg-ok">OK</button></div>
</div></div>
<div id="zoombar" class="panel">
  <button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button><button id="zoomReset" title="Redefinir">⟲</button>
</div>
<div id="syncbar" class="panel">
  <span id="status" class="st-off">Não conectado</span>
  <button id="loginBtn">Entrar com Google</button>
  <button id="saveBtn" title="Salvar (Ctrl+S)">💾 Salvar</button>
  <button id="logoutBtn" class="hidden">Sair</button>
</div>
<script src="viewer.js?v=202611011700"></script>
<script src="inline.js?v=202611011700"></script>
<script src="app.js?v=202611011700"></script>
</body>
</html>
